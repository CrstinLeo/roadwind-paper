[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smhi-trv-wind"
version = "0.6.0"
description = "SMHI weather stations -> Trafikverket roadside wind: height, roughness and site corrections"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2", "pyarrow", "requests", "scipy", "pyproj", "rasterio"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["smhi_trv_wind*"]

[tool.setuptools.package-data]
"smhi_trv_wind.viz" = ["map_template.html"]
